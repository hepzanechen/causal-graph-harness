<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <rect width="1280" height="640" fill="#12151f"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="14" markerHeight="14"
            markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7b8494"/>
    </marker>
  </defs>

  <!-- graph mark -->
  <line x1="276.9" y1="367.0" x2="309.7" y2="353.2" stroke="#7b8494" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow)"/>
  <line x1="276.9" y1="303.0" x2="309.7" y2="316.8" stroke="#7b8494" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow)"/>
  <circle cx="242.8" cy="381.4" r="29" fill="#eef1f8"/>
  <circle cx="242.8" cy="288.6" r="29" fill="#eef1f8"/>
  <circle cx="353" cy="335" r="35" fill="#2dd4bf"/>

  <!-- text -->
  <text x="560" y="278" font-family="Arial, Helvetica, sans-serif" font-size="56" font-weight="700" fill="#f4f6fb">Causal Graph Harness</text>
  <text x="562" y="330" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#9aa4b8">An auditable fact/deduction + Bayesian causal graph</text>
  <text x="562" y="366" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#9aa4b8">for AI agent research investigations</text>

  <!-- tag chips -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#2dd4bf">
    <text x="562" y="430">falsification-gated</text>
    <text x="792" y="430">deterministic</text>
    <text x="960" y="430">cross-agent</text>
  </g>
</svg>
