[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "causal-graph-harness"
version = "0.1.0"
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.setuptools]
packages = ["causal_graph", "adapters"]

[tool.pytest.ini_options]
testpaths = ["tests"]
